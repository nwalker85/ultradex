apiVersion: v1
kind: ConfigMap
metadata:
  name: glass-nginx
  namespace: ccc-tmp
data:
  default.conf.template: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      location / { try_files $uri $uri/ /index.html; }
      location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer ${ULTRADEX_API_TOKEN}";
      }
      location /health {
        proxy_pass http://api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Authorization "Bearer ${ULTRADEX_API_TOKEN}";
      }
      location /health/ready {
        proxy_pass http://api:8000/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Authorization "Bearer ${ULTRADEX_API_TOKEN}";
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ccc-tmp
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ccc-tmp
spec:
  ports:
    - port: 6379
  selector:
    app: redis
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: ccc-tmp
spec:
  ports:
    - name: client
      port: 4222
    - name: monitor
      port: 8222
  selector:
    app: nats
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ccc-tmp
spec:
  type: NodePort
  ports:
    - port: 8000
      nodePort: 30800
  selector:
    app: api
---
apiVersion: v1
kind: Service
metadata:
  name: glass
  namespace: ccc-tmp
spec:
  type: NodePort
  ports:
    - port: 8080
      nodePort: 30808
  selector:
    app: glass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ccc-tmp
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: ultradex
            - name: POSTGRES_PASSWORD
              value: ultradex_dev_password
            - name: POSTGRES_DB
              value: ultradex
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ultradex"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ccc-tmp
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: ccc-tmp
spec:
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.11-alpine
          args: ["-js", "-m", "8222", "--store_dir", "/data"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ccc-tmp
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ccc/ultradex:dev
          imagePullPolicy: Never
          command: ["sh", "-c", "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000"]
          envFrom:
            - secretRef:
                name: ultradex
          env:
            - name: DATABASE_URL
              value: postgresql://ultradex:ultradex_dev_password@postgres:5432/ultradex
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: NATS_URL
              value: nats://nats:4222
            - name: HOST
              value: 0.0.0.0
            - name: ULTRADEX_ENVIRONMENT
              value: personal
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 8
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ccc-tmp
spec:
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ccc/ultradex:dev
          imagePullPolicy: Never
          command: ["python", "-m", "arq", "core.workers.WorkerSettings"]
          envFrom:
            - secretRef:
                name: ultradex
          env:
            - name: DATABASE_URL
              value: postgresql://ultradex:ultradex_dev_password@postgres:5432/ultradex
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: NATS_URL
              value: nats://nats:4222
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobsearch-worker
  namespace: ccc-tmp
spec:
  selector:
    matchLabels:
      app: jobsearch-worker
  template:
    metadata:
      labels:
        app: jobsearch-worker
    spec:
      containers:
        - name: jobsearch-worker
          image: ccc/ultradex:dev
          imagePullPolicy: Never
          command: ["python", "-m", "core.jobsearch_worker"]
          envFrom:
            - secretRef:
                name: ultradex
          env:
            - name: DATABASE_URL
              value: postgresql://ultradex:ultradex_dev_password@postgres:5432/ultradex
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: NATS_URL
              value: nats://nats:4222
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glass
  namespace: ccc-tmp
spec:
  selector:
    matchLabels:
      app: glass
  template:
    metadata:
      labels:
        app: glass
    spec:
      containers:
        - name: glass
          image: ccc/glass:dev
          imagePullPolicy: Never
          env:
            - name: ULTRADEX_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ultradex
                  key: ULTRADEX_API_TOKEN
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
          readinessProbe:
            httpGet:
              path: /
              port: 8080
      volumes:
        - name: nginx
          configMap:
            name: glass-nginx
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gmail-sense
  namespace: ccc-tmp
spec:
  schedule: "17 */4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sweep
              image: ccc/ultradex:dev
              imagePullPolicy: Never
              command: ["python", "-m", "cli.sense_gmail"]
              envFrom:
                - secretRef:
                    name: ultradex
                - secretRef:
                    name: gmail-sense
              env:
                - name: REDIS_URL
                  value: redis://redis:6379/0
                - name: ULTRADEX_API_BASE
                  value: http://api:8000
---
