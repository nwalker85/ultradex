name: forgejo-build

# Profile B — Service/lib that ships a Harbor image but is deployed elsewhere.
# On merge to main, SSH to ravenmask@hrafngud and run .forgejo/build-on-host.sh:
# build + push the changed services' images to Harbor (tagged with the git SHA +
# :latest). NO deploy step — an app repo's compose or Argo/Helm consumes the image.
#
# Pairs with: .forgejo/build-on-host.sh, .forgejo/scope-lib.sh, .forgejo/services.map,
# and the shared PR gate .forgejo/workflows/ci.yml.
# Required secrets: HRAFNGUD_SSH_KEY, HARBOR_USERNAME, HARBOR_PASSWORD, CI_GIT_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated services to force-build (blank = auto by changed paths)"
        required: false
        default: ""

env:
  # Push via the INTERNAL harbor-nginx (:18088) to bypass Cloudflare's ~100MB tunnel
  # body cap that 413s large layers. Consumers pull the public harbor.ravenhelm.dev.
  REGISTRY: 127.0.0.1:18088
  HARBOR_PROJECT: ${{ github.event.repository.name }}
  HOST: hrafngud.ravenmask.net

jobs:
  build:
    runs-on: docker
    steps:
      - name: Install host SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HRAFNGUD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Build + push changed images on host
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.event.repository.name }}
          FORCE_SERVICES: ${{ github.event.inputs.services }}
          HU: ${{ secrets.HARBOR_USERNAME }}
          HP: ${{ secrets.HARBOR_PASSWORD }}
          FJTOKEN: ${{ secrets.CI_GIT_TOKEN }}
        run: |
          HU_B64=$(printf '%s' "$HU" | base64 | tr -d '\n')
          HP_B64=$(printf '%s' "$HP" | base64 | tr -d '\n')
          FJTOKEN_B64=$(printf '%s' "$FJTOKEN" | base64 | tr -d '\n')
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "ravenmask@${HOST}" \
            SHA="$SHA" REPO="$REPO" FORCE_SERVICES="$FORCE_SERVICES" REGISTRY="$REGISTRY" \
            HARBOR_PROJECT="$HARBOR_PROJECT" HU_B64="$HU_B64" HP_B64="$HP_B64" FJTOKEN_B64="$FJTOKEN_B64" \
            bash -seuo pipefail <<'REMOTE'
          FJTOKEN=$(printf '%s' "$FJTOKEN_B64" | base64 -d)
          WORK=$(mktemp -d); trap 'rm -rf "$WORK"' EXIT
          HU=$(printf '%s' "$HU_B64" | base64 -d)
          HP=$(printf '%s' "$HP_B64" | base64 -d)
          git clone -q --single-branch --branch main "http://nate:${FJTOKEN}@hrafngud.ravenmask.net:3300/nate/${REPO}.git" "$WORK/h"
          cd "$WORK/h"
          git checkout -q "$SHA"
          HU="$HU" HP="$HP" SHA="$SHA" REPO="$REPO" FORCE_SERVICES="$FORCE_SERVICES" \
            REGISTRY="$REGISTRY" HARBOR_PROJECT="$HARBOR_PROJECT" \
            bash .forgejo/build-on-host.sh
          REMOTE
