# snotra-template: v4
# Snotra — sovereign AI PR review council (Operation Goldberg). Hybrid image:
# runs the public `snotra-review` runtime image and fetches private lens prompts
# at runtime from nate/snotra. Reviews on PR open/reopen + `/oc` only.
# Router → code + security lenses → deterministic synthesis → one Forgejo review
# + commit status `snotra-qa / review` (ADR-0006 / ADR-0007).
#
# `synchronize` via pull_request_target only marks the head stale (ADR-0003) —
# no model, no re-review.
#
# Vendored file only. Needs:
#   secrets:   SNOTRA_GIT_TOKEN, FENRIR_LLM_KEY
#   variables: FENRIR_URL
#              SNOTRA_RUNNER_LABEL (optional)
#              SNOTRA_GATE (optional: advisory|enforce; default advisory)
#              SNOTRA_TIMEOUT_MS (optional)

name: snotra-review

on:
  pull_request:
    types: [opened, reopened]
  pull_request_target:
    types: [synchronize]
  issue_comment:
    types: [created]

jobs:
  review:
    runs-on: ${{ vars.SNOTRA_RUNNER_LABEL || 'docker' }}
    container:
      image: harbor.ravenhelm.dev/snotra/snotra-review@sha256:1214c7efb3c6b72f5f379f4bb160ee9e2ca802d4162aec947a62adafcf6d2c07
    env:
      GITEA_TOKEN: ${{ secrets.SNOTRA_GIT_TOKEN }}
      SNOTRA_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITEA_SERVER_URL: ${{ github.server_url }}
      FENRIR_LLM_KEY: ${{ secrets.FENRIR_LLM_KEY }}
      FENRIR_URL: ${{ vars.FENRIR_URL }}
      SNOTRA_TIMEOUT_MS: ${{ vars.SNOTRA_TIMEOUT_MS || '300000' }}
      SNOTRA_GATE: ${{ vars.SNOTRA_GATE || 'advisory' }}
      PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      SNOTRA_PROMPTS_DIR: /app/.snotra-review/prompts
    steps:
      - name: Route event and review when requested
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          IS_PULL_REQUEST_COMMENT: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          mode="$(bash /app/.snotra-review/scripts/select-review-event.sh \
            "$EVENT_NAME" "$EVENT_ACTION" "$IS_PULL_REQUEST_COMMENT" "$COMMENT_BODY")"
          if [[ "$mode" != "review" ]]; then
            echo "Snotra review no-op: mode=${mode}"
            exit 0
          fi

          mkdir -p "${SNOTRA_PROMPTS_DIR}"
          curl -fsS -H "Authorization: token ${GITEA_TOKEN}" \
            "${GITEA_SERVER_URL}/api/v1/repos/nate/snotra/raw/template/.snotra-review/prompts/code.md?ref=main" \
            -o "${SNOTRA_PROMPTS_DIR}/code.md"
          curl -fsS -H "Authorization: token ${GITEA_TOKEN}" \
            "${GITEA_SERVER_URL}/api/v1/repos/nate/snotra/raw/template/.snotra-review/prompts/security.md?ref=main" \
            -o "${SNOTRA_PROMPTS_DIR}/security.md"
          echo "loaded council prompts code=$(wc -l < "${SNOTRA_PROMPTS_DIR}/code.md") security=$(wc -l < "${SNOTRA_PROMPTS_DIR}/security.md") lines"

          bun /app/.snotra-review/review.ts

  mark-stale:
    needs: review
    runs-on: docker
    container:
      image: harbor.ravenhelm.dev/snotra/snotra-review@sha256:1214c7efb3c6b72f5f379f4bb160ee9e2ca802d4162aec947a62adafcf6d2c07
    steps:
      - name: Mark the new head as not yet reviewed
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          IS_PULL_REQUEST_COMMENT: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          route_event="$EVENT_NAME"
          if [[ "$route_event" == "pull_request_target" ]]; then
            route_event="pull_request"
          fi
          mode="$(bash /app/.snotra-review/scripts/select-review-event.sh \
            "$route_event" "$EVENT_ACTION" "$IS_PULL_REQUEST_COMMENT" "$COMMENT_BODY")"
          if [[ "$mode" != "mark-stale" ]]; then
            echo "Snotra stale marker no-op: mode=${mode}"
            exit 0
          fi

          # Pending on the review job context so an old council verdict is not
          # mistaken for the new head. QA gate context is also pending until /oc.
          for ctx in "snotra-review / review (pull_request)" "snotra-qa / review"; do
            curl -fsS -X POST \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -H 'Content-Type: application/json' \
              "${API}/repos/${OWNER}/${REPO}/statuses/${SHA}" \
              -d "$(python3 -c "import json; print(json.dumps({
                'context': '''${ctx}''',
                'state': 'pending',
                'description': 'new commits since the last review — comment /oc to re-review'
              }))")" > /dev/null
          done
          echo "marked ${SHA} as not-yet-reviewed"
