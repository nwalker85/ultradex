# snotra-template: v3
# Snotra — sovereign AI PR review (Operation Goldberg). Hybrid image model:
# runs the public `snotra-review` runtime image (no proprietary content baked in)
# and fetches the private tuned prompt at runtime from nate/snotra via the bot
# token. Reviews on PR open/reopen + `/oc` only. COMMENT-state only — never
# blocks a merge.
#
# `synchronize` runs through pull_request_target but NEVER runs a review (ADR-0002
# holds: no auto-re-review on push). The trusted base workflow runs only
# `mark-stale`, which posts a neutral status on the new head using Forgejo's
# ephemeral repository token. No model is invoked — zero tokens, zero comments.
# See ADR-0003.
#
# This whole file is the ONLY thing a repo vendors — everything else lives in the
# pinned image. Needs (set once, user-level, inherited fleet-wide):
#   secrets:   SNOTRA_GIT_TOKEN (snotra bot; also reads the private prompt),
#              FENRIR_LLM_KEY
#   variables: FENRIR_URL   (e.g. http://fenrir:11434 — config, never hardcoded)
#              SNOTRA_RUNNER_LABEL (optional routed lane; defaults to `docker`)

name: snotra-review

on:
  pull_request:
    types: [opened, reopened]
  # The pull_request token is intentionally read-only. This trusted-base event
  # supplies an ephemeral repository token for the status-only stale marker.
  # The workflow never checks out or executes pull-request code.
  pull_request_target:
    types: [synchronize]
  issue_comment:
    types: [created]

jobs:
  review:
    # Do not use a job-level `if`: Forgejo Runner 6.4.0 reports a false guard
    # as a failed Early termination. The tested selector makes non-review
    # events a successful no-op inside the job instead.
    runs-on: ${{ vars.SNOTRA_RUNNER_LABEL || 'docker' }}
    container:
      image: harbor.ravenhelm.dev/snotra/snotra-review@sha256:e0e22d5fb519d0dbf6064520d15f27a7b17a5ca25d9c72a123b71444d076f8f4
    env:
      GITEA_TOKEN: ${{ secrets.SNOTRA_GIT_TOKEN }}
      GITEA_SERVER_URL: ${{ github.server_url }}
      FENRIR_LLM_KEY: ${{ secrets.FENRIR_LLM_KEY }}
      FENRIR_URL: ${{ vars.FENRIR_URL }}
      SNOTRA_TIMEOUT_MS: ${{ vars.SNOTRA_TIMEOUT_MS || '300000' }}
      PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      SNOTRA_PROMPT_PATH: /app/.snotra-review/review-prompt.md
    steps:
      - name: Route event and review when requested
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          IS_PULL_REQUEST_COMMENT: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          mode="$(bash /app/.snotra-review/scripts/select-review-event.sh \
            "$EVENT_NAME" "$EVENT_ACTION" "$IS_PULL_REQUEST_COMMENT" "$COMMENT_BODY")"
          if [[ "$mode" != "review" ]]; then
            echo "Snotra review no-op: mode=${mode}"
            exit 0
          fi

          curl -fsS -H "Authorization: token ${GITEA_TOKEN}" \
            "${GITEA_SERVER_URL}/api/v1/repos/nate/snotra/raw/template/.snotra-review/review-prompt.md?ref=main" \
            -o "${SNOTRA_PROMPT_PATH}"
          echo "loaded private review prompt ($(wc -l < "${SNOTRA_PROMPT_PATH}") lines)"

          bun /app/.snotra-review/review.ts

  mark-stale:
    # A push landed after Snotra last looked. Do NOT re-review (ADR-0002) — just
    # make the gap visible, so an older review cannot be mistaken for a verdict on
    # the current head. Pure API call: no container image, no model, no comment.
    #
    # Serialize after `review`: on synchronize that job completes its no-op
    # before this job posts the review context's pending status, so completion
    # cannot race and overwrite the pending marker.
    needs: review
    runs-on: docker
    container:
      # Same pinned Harbor image as the review job: it is already cached on the
      # runner and ships curl. Avoids depending on the default job image or on
      # egress to a public registry (these runners have none).
      image: harbor.ravenhelm.dev/snotra/snotra-review@sha256:e0e22d5fb519d0dbf6064520d15f27a7b17a5ca25d9c72a123b71444d076f8f4
    steps:
      - name: Mark the new head as not yet reviewed
        env:
          # Runner 6.x exposes Forgejo's automatic token under the GitHub-
          # compatible alias. On pull_request_target it is repository-scoped,
          # writable, and destroyed when the workflow completes.
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          IS_PULL_REQUEST_COMMENT: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          route_event="$EVENT_NAME"
          if [[ "$route_event" == "pull_request_target" ]]; then
            route_event="pull_request"
          fi
          mode="$(bash /app/.snotra-review/scripts/select-review-event.sh \
            "$route_event" "$EVENT_ACTION" "$IS_PULL_REQUEST_COMMENT" "$COMMENT_BODY")"
          if [[ "$mode" != "mark-stale" ]]; then
            echo "Snotra stale marker no-op: mode=${mode}"
            exit 0
          fi

          # `pending` (not failure): Snotra is advisory and must never look like a
          # gate. Branch protection requires the CI contexts, never this one.
          curl -fsS -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H 'Content-Type: application/json' \
            "${API}/repos/${OWNER}/${REPO}/statuses/${SHA}" \
            -d '{
                  "context": "snotra-review / review (pull_request)",
                  "state": "pending",
                  "description": "new commits since the last review — comment /oc to re-review"
                }' > /dev/null
          echo "marked ${SHA} as not-yet-reviewed"
