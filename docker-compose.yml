version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ultradex-postgres
    environment:
      POSTGRES_USER: ultradex
      POSTGRES_PASSWORD: ultradex_dev_password
      POSTGRES_DB: ultradex
    ports:
      - "5432:5432"
    volumes:
      - ultradex_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultradex"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ultradex-api
    environment:
      DATABASE_URL: postgresql://ultradex:ultradex_dev_password@postgres:5432/ultradex
      DEX_API_KEY: ${DEX_API_KEY}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  ultradex_db:
