version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hrafngrima-postgres
    environment:
      POSTGRES_USER: hrafngrima
      POSTGRES_PASSWORD: hrafngrima_dev_password
      POSTGRES_DB: hrafngrima
    ports:
      - "5432:5432"
    volumes:
      - hrafngrima_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrafngrima"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrafngrima-api
    environment:
      DATABASE_URL: postgresql://hrafngrima:hrafngrima_dev_password@postgres:5432/hrafngrima
      DEX_API_KEY: ${DEX_API_KEY}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  hrafngrima_db:
